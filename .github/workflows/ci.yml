name: AITOOLS Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Test Suite (Unit, Integration & Providers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Run Backend Test Suite
        run: npm test
        working-directory: server
        env:
          NODE_ENV: test

  security-tests:
    name: Security & Multi-Tenant Authorization Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Run Security Test Suite
        run: npm run test:security
        working-directory: server
        env:
          NODE_ENV: test

  frontend-tests:
    name: Frontend React Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Run Frontend Tests
        run: npm test -- --watchAll=false
        working-directory: client
        env:
          CI: true

  frontend-build:
    name: Frontend Production Bundle Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci --legacy-peer-deps
        working-directory: client

      - name: Build Production Bundle
        run: npm run build
        working-directory: client
        env:
          NODE_ENV: production
          REACT_APP_BASE_URL: /api/v1
          CI: false

  docker-build-backend:
    name: Docker Backend Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, security-tests]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: aitools-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-frontend:
    name: Docker Frontend Image Build Validation
    runs-on: ubuntu-latest
    needs: [frontend-tests, frontend-build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Production Image (No Push)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          build-args: |
            REACT_APP_BASE_URL=/api/v1
          push: false
          tags: aitools-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
